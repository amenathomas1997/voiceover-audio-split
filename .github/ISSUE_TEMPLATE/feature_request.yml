name: Feature idea
description: Suggest something new or a better way to do something
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help you?
      description: For example, a task that is hard today, or a feature you know from JAWS, NVDA or another tool.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app is it about?
      options:
        - Audio split and sound
        - Keyboard shortcuts
        - Reading and seeing (scanning, Doc Reader, screen text, camera tools)
        - Spoken events and status
        - The AI assistant and image descriptions
        - Low vision (captions, focus frame)
        - Something new
  - type: textarea
    id: today
    attributes:
      label: How do you do this today?
      description: Optional. A workaround, another app, or "I can't".
