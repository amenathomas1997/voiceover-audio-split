name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the committed project was generated with: other
      # versions write the files slightly differently, which would fail the check.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.45.4"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the Xcode project matches project.yml
        working-directory: App
        run: |
          xcodegen --version
          xcodegen --quiet
          # Only the project file: Xcode rewrites the shared scheme in its own format
          # when it builds locally, and CI uses the freshly generated scheme anyway.
          git diff --exit-code -- VoiceOverAudioSplit.xcodeproj/project.pbxproj || {
            echo "::error::VoiceOverAudioSplit.xcodeproj is out of date. Run 'xcodegen' in App/ and commit the result."
            exit 1
          }

      # Signing needs the team's certificates, which CI doesn't have; release
      # builds for TestFlight are signed and uploaded locally with App/release.sh.
      - name: Build Debug
        run: >
          xcodebuild -project App/VoiceOverAudioSplit.xcodeproj -scheme VoiceOverAudioSplit
          -configuration Debug -destination 'platform=macOS' -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO build

      - name: Build Release
        run: >
          xcodebuild -project App/VoiceOverAudioSplit.xcodeproj -scheme VoiceOverAudioSplit
          -configuration Release -destination 'platform=macOS' -derivedDataPath build/rel
          CODE_SIGNING_ALLOWED=NO build

      # Unit tests run inside the app, so it is signed ad hoc (no certificates needed).
      - name: Run unit tests
        run: >
          xcodebuild -project App/VoiceOverAudioSplit.xcodeproj -scheme VoiceOverAudioSplit
          -destination 'platform=macOS' -derivedDataPath build/test -resultBundlePath build/TestResults.xcresult
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  installer:
    name: Build the app installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the installer package
        run: ./build.sh

      - name: Check the installer puts the app in Applications
        run: |
          pkgutil --payload-files "build/VoiceOver Audio Split.pkg" | grep -qx "./Applications/VoiceOver Audio Split.app"
          pkgutil --expand "build/VoiceOver Audio Split.pkg" build/expanded
          grep -q 'relocatable="false"' build/expanded/app-component.pkg/PackageInfo

      - name: Upload the installer package
        uses: actions/upload-artifact@v4
        with:
          name: VoiceOver-Audio-Split-installer
          path: build/VoiceOver Audio Split.pkg
