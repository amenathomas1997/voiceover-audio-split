# Generate the Xcode project with:  cd App && xcodegen
name: VoiceOverAudioSplit
options:
  bundleIdPrefix: com.fullcircleat
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    DEVELOPMENT_TEAM: 9G2D7CDZ5D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "202610231930"
    SWIFT_VERSION: "5.0"
    # Translations: the compiler lists every translatable phrase, and String
    # Catalogs (Resources/Localizable.xcstrings) hold the translations.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  VoiceOverAudioSplit:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fullcircleat.VoiceOverAudioSplit
        PRODUCT_NAME: VoiceOver Audio Split
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VoiceOverAudioSplit.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_MODULE_NAME: VoiceOverAudioSplit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Development builds get their own app ID, so macOS never confuses them with
        # the installed app: permissions such as screen recording belong to one ID,
        # and a test build with the same ID made screen capture check the wrong copy.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.fullcircleat.VoiceOverAudioSplit.debug
    scheme:
      testTargets:
        - VoiceOverAudioSplitTests
  # Unit tests for logic that needs no hardware, permissions or VoiceOver.
  # They run inside the app, which skips its normal startup under XCTest.
  VoiceOverAudioSplitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: VoiceOverAudioSplit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fullcircleat.VoiceOverAudioSplitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoiceOver Audio Split.app/Contents/MacOS/VoiceOver Audio Split"
        BUNDLE_LOADER: "$(TEST_HOST)"
