# Generate the Xcode project with:  cd App && xcodegen
name: VoiceOverAudioSplit
options:
  bundleIdPrefix: com.fullcircleat
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    DEVELOPMENT_TEAM: 9G2D7CDZ5D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  VoiceOverAudioSplit:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fullcircleat.VoiceOverAudioSplit
        PRODUCT_NAME: VoiceOver Audio Split
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VoiceOverAudioSplit.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
